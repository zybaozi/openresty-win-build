name: Build OpenResty (Windows x64)

# 说明：openresty 的 git 仓库根目录没有 configure，也没有 bundle/。
# 所以必须先跑 util/mirror-tarballs 把完整源码树拼出来，再进目录编译。
# 直接 ./util/build-win32.sh 一定会报 ./configure: No such file or directory。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'upstream ref: master / v1.31.8.1'
        required: true
        default: 'master'
      jobs:
        description: '并行编译数（runner 4 核，建议 4）'
        required: false
        default: '4'

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: openresty/openresty
          ref: ${{ inputs.ref }}
          path: src

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            dos2unix
            git
            make
            mercurial
            patch
            perl
            unzip
            wget
            curl
            zip
            diffutils
            mingw-w64-x86_64-toolchain

      - name: Check toolchain
        run: |
          echo "MSYSTEM=$MSYSTEM"
          gcc -dumpmachine
          make --version | head -1

      - name: Assemble source bundle
        run: |
          set -e
          cd src
          bash util/mirror-tarballs
          ls -d openresty-*

      - name: Build OpenResty
        run: |
          set -e
          cd src
          VER=$(./util/ver)
          echo "building OpenResty $VER"
          cd "openresty-$VER"
          # 官方脚本里 JOBS=12，按 runner 核数调低
          sed -i "s|^JOBS=.*|JOBS=${{ inputs.jobs }}|" util/build-win32.sh
          # 保持 --prefix= 为空：安装落在构建目录内，路径全相对，产物可绿色分发
          bash ./util/build-win32.sh
          echo "=== nginx.exe ==="
          find . -maxdepth 3 -name nginx.exe -type f

      - name: Package
        run: |
          set -e
          cd src
          VER=$(./util/ver)
          cd "openresty-$VER"
          DIST="openresty-$VER-win64"
          rm -rf "$DIST"
          mkdir -p "$DIST"

          for f in resty restydoc restydoc-index nginx.exe luajit.exe lua51.dll lua include lualib html conf logs pod COPYRIGHT; do
            if [ -e "$f" ]; then
              cp -r "$f" "$DIST/"
            else
              echo "WARN: missing $f"
            fi
          done

          if [ ! -f "$DIST/nginx.exe" ]; then
            NX=$(find . -maxdepth 3 -name nginx.exe -type f | head -n1)
            if [ -n "$NX" ]; then
              cp "$NX" "$DIST/nginx.exe"
            fi
          fi

          # 带上 MinGW 运行时 dll，避免目标机缺库
          for dll in libgcc_s_seh-1.dll libwinpthread-1.dll libstdc++-6.dll; do
            if [ -f "/mingw64/bin/$dll" ]; then
              cp "/mingw64/bin/$dll" "$DIST/"
            fi
          done

          if [ -f README-windows.txt ]; then
            cp README-windows.txt "$DIST/README.txt"
          fi

          echo "=== 版本自检 ==="
          "./$DIST/nginx.exe" -v 2>&1 || true
          echo "=== 包内文件 ==="
          ls "$DIST"

          OUT=$(cygpath -u "$GITHUB_WORKSPACE")
          zip -qr "$OUT/openresty-$VER-win64.zip" "$DIST"
          ls -lh "$OUT"/openresty-*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: openresty-win64
          path: openresty-*-win64.zip
          retention-days: 30
