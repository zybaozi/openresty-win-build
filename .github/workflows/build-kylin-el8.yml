name: Build OpenResty (Kylin V10 Server / el8)

# 银河麒麟 V10 Server 底座是 CentOS 8 / RHEL 8 生态，glibc 2.28。
# 编出来的二进制最高 GLIBC 符号版本必须 <= 2.28，否则拷到麒麟上会报
# "GLIBC_2.34 not found"。所以这里用 rockylinux:8 容器做编译环境，
# 绝不能用 ubuntu-latest 裸编（那是 glibc 2.39）。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'upstream ref: master / v1.31.8.1'
        required: true
        default: 'master'
      arm64:
        description: '是否同时构建 aarch64（飞腾/鲲鹏）'
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'

jobs:
  build-x86_64:
    name: Kylin V10 / el8 (x86_64)
    runs-on: ubuntu-latest
    container: rockylinux:8

    steps:
      - name: Install build deps
        run: |
          set -e

          PKGS="git gcc gcc-c++ make perl perl-core patch tar gzip wget unzip \
                which findutils binutils procps-ng \
                pcre2-devel pcre-devel zlib-devel openssl-devel"

          # Rocky 8 的 BaseOS / AppStream 镜像偶尔不同步：AppStream 已发
          # gcc-8.5.0-31.el8_10，BaseOS 的 libgcc 还停在旧版，于是报
          #   nothing provides libgcc >= 8.5.0-31.el8_10
          # 这是源的问题，不是环境的问题。清缓存换镜像节点 + --nobest 重试即可。
          ok=0
          for attempt in 1 2 3; do
            echo ">>> 第 $attempt 次尝试安装编译依赖"
            dnf clean all >/dev/null 2>&1 || true
            if dnf install -y --refresh --nobest --allowerasing \
                 --setopt=install_weak_deps=False --setopt=retries=5 $PKGS; then
              ok=1
              break
            fi
            echo ">>> 安装失败，尝试把 libgcc / libstdc++ / libgomp 升到仓库最新再重试"
            dnf upgrade -y --refresh libgcc libstdc++ libgomp || true
            sleep 10
          done

          if [ "$ok" != "1" ]; then
            echo "ERROR: 编译依赖安装失败（Rocky 8 镜像源版本错位），重跑一次 workflow 即可"
            exit 1
          fi

          for c in gcc make perl wget patch objdump; do
            command -v "$c" >/dev/null 2>&1 || { echo "ERROR: 缺少 $c"; exit 1; }
          done

          # 可选依赖，缺了用兜底 shim 顶上
          dnf install -y dos2unix || true
          dnf install -y perl-XML-Parser perl-XML-Simple || true

          if ! command -v unix2dos >/dev/null 2>&1; then
            printf '#!/bin/sh\nexit 0\n' > /usr/local/bin/unix2dos
            chmod +x /usr/local/bin/unix2dos
            echo "shim: unix2dos"
          fi
          if ! command -v pod2text >/dev/null 2>&1; then
            printf '#!/bin/sh\ncat\n' > /usr/local/bin/pod2text
            chmod +x /usr/local/bin/pod2text
            echo "shim: pod2text"
          fi

          echo "=== 环境自检 ==="
          ldd --version | head -1
          gcc --version | head -1

          # Linux 版 OpenResty 用系统库，缺 pcre2-devel 就会在 configure 阶段报
          # "the HTTP rewrite module requires the PCRE library"
          echo "=== 依赖自检 ==="
          ls -l /usr/include/pcre2.h /usr/include/openssl/ssl.h /usr/include/zlib.h

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: openresty/openresty
          ref: ${{ inputs.ref }}
          path: src

      # git 仓库里没有 configure / bundle/，必须先拼装源码树
      # pcre2 / zlib 走源码静态编译进 nginx，产物不再依赖系统的 libpcre2 / libz。
      # openssl 保持动态（走系统库），方便安全更新和后续国密改造。
      - name: Fetch static lib sources
        run: |
          set -e
          PCRE_VER=10.49
          ZLIB_VER=1.3.2
          mkdir -p /tmp/deps && cd /tmp/deps
          wget -q "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${PCRE_VER}/pcre2-${PCRE_VER}.tar.gz"
          wget -q "https://zlib.net/fossils/zlib-${ZLIB_VER}.tar.gz"
          tar xzf "pcre2-${PCRE_VER}.tar.gz"
          tar xzf "zlib-${ZLIB_VER}.tar.gz"
          ls -d "/tmp/deps/pcre2-${PCRE_VER}" "/tmp/deps/zlib-${ZLIB_VER}"

      - name: Assemble source bundle
        run: |
          set -e
          cd src
          bash util/mirror-tarballs
          ls -d openresty-*

      - name: Build OpenResty
        run: |
          set -e
          cd src
          VER=$(./util/ver)
          echo "building OpenResty $VER"
          cd "openresty-$VER"
          ./configure \
            --prefix=/usr/local/openresty \
            --with-pcre-jit \
            --with-pcre=/tmp/deps/pcre2-10.49 \
            --with-zlib=/tmp/deps/zlib-1.3.2 \
            --with-stream \
            --with-stream_ssl_module \
            --with-stream_ssl_preread_module \
            --with-http_v2_module \
            --with-http_stub_status_module \
            --with-http_realip_module \
            --with-http_addition_module \
            --with-http_auth_request_module \
            --with-http_secure_link_module \
            --with-http_random_index_module \
            --with-http_gzip_static_module \
            --with-http_sub_module \
            --with-http_dav_module \
            --with-http_flv_module \
            --with-http_mp4_module \
            --with-http_gunzip_module
          make -j"$(nproc)"
          # DESTDIR 走暂存目录，编译进去的 prefix 仍是 /usr/local/openresty
          make install DESTDIR=/tmp/stage

      - name: Verify and package
        run: |
          set -e
          cd src
          VER=$(./util/ver)
          PREFIX_ROOT=/tmp/stage/usr/local/openresty
          BIN=$PREFIX_ROOT/nginx/sbin/nginx

          # LuaJIT 是动态库，装在 prefix/luajit/lib 下。在暂存目录里直接跑二进制
          # 会报 libluajit-5.1.so.2: cannot open shared object file，因为 rpath 指向
          # 的是安装后的绝对路径。装上之后自动能找到，不影响交付，这里显式补一下。
          export LD_LIBRARY_PATH="$PREFIX_ROOT/luajit/lib:${LD_LIBRARY_PATH:-}"

          echo "=== nginx -V ==="
          $BIN -V 2>&1 | tee "/tmp/nginx-V-$VER-x86_64.txt"

          echo "=== 最高 GLIBC 符号版本（必须 <= 2.28）==="
          objdump -T $BIN | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -3

          echo "=== 内嵌 rpath ==="
          readelf -d $BIN | grep -E 'RPATH|RUNPATH' || echo "(无 rpath)"

          echo "=== 直接依赖 DT_NEEDED ==="
          readelf -d $BIN | grep NEEDED

          # 只看二进制自身的 DT_NEEDED。不能用 ldd 判断：ldd 会把 libssl 之类的
          # 传递依赖（比如 libz）也列出来，导致静态链接被误判成动态。
          echo "=== 校验：pcre2 / zlib 必须静态进二进制 ==="
          if readelf -d $BIN | grep -E 'NEEDED.*(libpcre|libz\.so)'; then
            echo "ERROR: pcre2/zlib 仍是动态链接"
            exit 1
          fi
          echo "OK: pcre2 / zlib 已静态链接"

          echo "=== 动态库全量解析 ==="
          ldd $BIN

          if ldd $BIN | grep -q 'not found'; then
            echo "ERROR: 存在未满足的动态依赖"
            exit 1
          fi

          echo "=== 目标机必须具备的系统库（麒麟 V10 自带）==="
          ldd $BIN | grep -v "$PREFIX_ROOT" || true

          mkdir -p out
          tar czf "out/openresty-${VER}-el8-x86_64.tar.gz" -C /tmp/stage usr/local/openresty
          cp "/tmp/nginx-V-$VER-x86_64.txt" out/

          echo "=== 包内顶层结构 ==="
          tar tzf "out/openresty-${VER}-el8-x86_64.tar.gz" | head -8
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: openresty-el8-x86_64
          path: src/out/*
          retention-days: 30

  build-aarch64:
    name: Kylin V10 / el8 (aarch64)
    if: ${{ inputs.arm64 == 'yes' }}
    runs-on: ubuntu-24.04-arm
    container: rockylinux:8

    steps:
      - name: Install build deps
        run: |
          set -e

          PKGS="git gcc gcc-c++ make perl perl-core patch tar gzip wget unzip \
                which findutils binutils procps-ng \
                pcre2-devel pcre-devel zlib-devel openssl-devel"

          ok=0
          for attempt in 1 2 3; do
            echo ">>> 第 $attempt 次尝试安装编译依赖"
            dnf clean all >/dev/null 2>&1 || true
            if dnf install -y --refresh --nobest --allowerasing \
                 --setopt=install_weak_deps=False --setopt=retries=5 $PKGS; then
              ok=1
              break
            fi
            echo ">>> 安装失败，尝试把 libgcc / libstdc++ / libgomp 升到仓库最新再重试"
            dnf upgrade -y --refresh libgcc libstdc++ libgomp || true
            sleep 10
          done

          if [ "$ok" != "1" ]; then
            echo "ERROR: 编译依赖安装失败（Rocky 8 镜像源版本错位），重跑一次 workflow 即可"
            exit 1
          fi

          for c in gcc make perl wget patch objdump; do
            command -v "$c" >/dev/null 2>&1 || { echo "ERROR: 缺少 $c"; exit 1; }
          done

          dnf install -y dos2unix || true
          dnf install -y perl-XML-Parser perl-XML-Simple || true
          if ! command -v unix2dos >/dev/null 2>&1; then
            printf '#!/bin/sh\nexit 0\n' > /usr/local/bin/unix2dos
            chmod +x /usr/local/bin/unix2dos
          fi
          if ! command -v pod2text >/dev/null 2>&1; then
            printf '#!/bin/sh\ncat\n' > /usr/local/bin/pod2text
            chmod +x /usr/local/bin/pod2text
          fi
          echo "=== 环境自检 ==="
          uname -m
          ldd --version | head -1
          ls -l /usr/include/pcre2.h /usr/include/openssl/ssl.h /usr/include/zlib.h

      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: openresty/openresty
          ref: ${{ inputs.ref }}
          path: src

      # pcre2 / zlib 走源码静态编译进 nginx，产物不再依赖系统的 libpcre2 / libz。
      # openssl 保持动态（走系统库），方便安全更新和后续国密改造。
      - name: Fetch static lib sources
        run: |
          set -e
          PCRE_VER=10.49
          ZLIB_VER=1.3.2
          mkdir -p /tmp/deps && cd /tmp/deps
          wget -q "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-${PCRE_VER}/pcre2-${PCRE_VER}.tar.gz"
          wget -q "https://zlib.net/fossils/zlib-${ZLIB_VER}.tar.gz"
          tar xzf "pcre2-${PCRE_VER}.tar.gz"
          tar xzf "zlib-${ZLIB_VER}.tar.gz"
          ls -d "/tmp/deps/pcre2-${PCRE_VER}" "/tmp/deps/zlib-${ZLIB_VER}"

      - name: Assemble source bundle
        run: |
          set -e
          cd src
          bash util/mirror-tarballs
          ls -d openresty-*

      - name: Build OpenResty
        run: |
          set -e
          cd src
          VER=$(./util/ver)
          echo "building OpenResty $VER"
          cd "openresty-$VER"
          ./configure \
            --prefix=/usr/local/openresty \
            --with-pcre-jit \
            --with-pcre=/tmp/deps/pcre2-10.49 \
            --with-zlib=/tmp/deps/zlib-1.3.2 \
            --with-stream \
            --with-stream_ssl_module \
            --with-stream_ssl_preread_module \
            --with-http_v2_module \
            --with-http_stub_status_module \
            --with-http_realip_module \
            --with-http_addition_module \
            --with-http_auth_request_module \
            --with-http_secure_link_module \
            --with-http_random_index_module \
            --with-http_gzip_static_module \
            --with-http_sub_module \
            --with-http_dav_module \
            --with-http_flv_module \
            --with-http_mp4_module \
            --with-http_gunzip_module
          make -j"$(nproc)"
          make install DESTDIR=/tmp/stage

      - name: Verify and package
        run: |
          set -e
          cd src
          VER=$(./util/ver)
          PREFIX_ROOT=/tmp/stage/usr/local/openresty
          BIN=$PREFIX_ROOT/nginx/sbin/nginx

          # LuaJIT 是动态库，暂存目录里直接跑会找不到，装上后由 rpath 自动定位
          export LD_LIBRARY_PATH="$PREFIX_ROOT/luajit/lib:${LD_LIBRARY_PATH:-}"

          echo "=== nginx -V ==="
          $BIN -V 2>&1 | tee "/tmp/nginx-V-$VER-aarch64.txt"

          echo "=== 最高 GLIBC 符号版本（必须 <= 2.28）==="
          objdump -T $BIN | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -3

          echo "=== 内嵌 rpath ==="
          readelf -d $BIN | grep -E 'RPATH|RUNPATH' || echo "(无 rpath)"

          echo "=== 直接依赖 DT_NEEDED ==="
          readelf -d $BIN | grep NEEDED

          # 只看 DT_NEEDED，不用 ldd（ldd 含传递依赖，会把 libz 误算进来）
          echo "=== 校验：pcre2 / zlib 必须静态进二进制 ==="
          if readelf -d $BIN | grep -E 'NEEDED.*(libpcre|libz\.so)'; then
            echo "ERROR: pcre2/zlib 仍是动态链接"
            exit 1
          fi
          echo "OK: pcre2 / zlib 已静态链接"

          echo "=== 动态库全量解析 ==="
          ldd $BIN

          if ldd $BIN | grep -q 'not found'; then
            echo "ERROR: 存在未满足的动态依赖"
            exit 1
          fi

          echo "=== 目标机必须具备的系统库 ==="
          ldd $BIN | grep -v "$PREFIX_ROOT" || true

          mkdir -p out
          tar czf "out/openresty-${VER}-el8-aarch64.tar.gz" -C /tmp/stage usr/local/openresty
          cp "/tmp/nginx-V-$VER-aarch64.txt" out/
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: openresty-el8-aarch64
          path: src/out/*
          retention-days: 30
